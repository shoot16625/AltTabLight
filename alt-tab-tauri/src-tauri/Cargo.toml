[package]
name = "alt-tab-tauri"
version = "1.0.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "alt_tab_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
once_cell = "1"
log = "0.4"
env_logger = "0.11"
png = "0.17"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
cocoa = "0.26"
objc = "0.2"
objc-foundation = "0.1"
objc_id = "0.1"
